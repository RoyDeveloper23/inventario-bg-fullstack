<header class="app-header">
  <div class="bar">
    <a routerLink="/" class="brand">
      <span class="brand-mark" aria-hidden="true">BGD</span>
      <span>Inventario BG</span>
    </a>
    <div class="user">
      <span class="user-name">{{ auth.usuario()?.nombre }}</span>
      <button
        type="button"
        class="btn btn-ghost btn-sm theme-toggle"
        (click)="theme.alternar()"
        [attr.aria-label]="theme.isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
        [title]="theme.isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
      >
        @if (theme.isDark()) {
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" />
          </svg>
        } @else {
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4">
            <path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z" />
          </svg>
        }
      </button>
      <button type="button" class="btn btn-ghost btn-sm hover:bg-gray-200" (click)="logout()">Cerrar sesión</button>
    </div>
  </div>
</header>
<main class="content">
  <router-outlet />
</main>
